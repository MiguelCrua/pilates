const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pick(cands){const w=W[lvl];const ws=cands.map(e=>w[e.l]||0);const t=ws.reduce((a,b)=>a+b,0);if(!t)return null;let r=Math.random()*t;for(let i=0;i<cands.length;i++){r-=ws[i];if(r<=0)return cands[i]}return cands[cands.length-1]}
const fit=(p,rem,used)=>lib().filter(e=>e.p===p&&e.m<=rem&&!used.has(e.n)&&(W[lvl][e.l]||0)>0);
function build(){undo=null;$("ts").hidden=true;const used=new Set();plan={};
for(const p of["a","m","f"]){let rem=TG[p],list=[];
while(true){let e=pick(fit(p,rem,used)),r=0;if(!e){e=pick(fit(p,rem,new Set(list.filter(x=>x.r).map(x=>x.n))));r=1}if(!e)break;list.push(r?{...e,r:1}:e);used.add(e.n);rem-=e.m}
if(p!=="f")list.sort((a,b)=>a.o-b.o);plan[p]=list}
render()}
function swap(p,i){const used=new Set(Object.values(plan).flat().map(e=>e.n));const cur=plan[p][i];
const sum=plan[p].reduce((a,e)=>a+e.m,0);const room=TG[p]-sum+cur.m;
const e=pick(fit(p,room,used));if(e){plan[p][i]=e;render()}}
function render(){const all=Object.values(plan).flat(),tot=all.reduce((a,e)=>a+e.m,0);
let h=`<div class="sum"><span class="badge">${ic("clock")}${tot} min</span><span class="badge">${all.length} exercícios</span><span class="badge">${LN[lvl]}</span></div>`;
for(const p of["a","m","f"]){const t=plan[p].reduce((a,e)=>a+e.m,0);
h+=`<section class="card"><div class="ch"><button class="tg" data-p="${p}" aria-expanded="${!col[p]}"><span class="chev${col[p]?' shut':''}">${ic("down")}</span><span><span class="h2">${NM[p]}</span><span class="muted">${plan[p].length} exercícios · ${t} min</span></span></button><button class="btn ghost icon pl" data-p="${p}" aria-label="Adicionar exercício">${ic("plus")}</button></div><div class="cb${col[p]?' shut':''}"><ul>`;
plan[p].forEach((e,i)=>{h+=`<li class="ex" data-p="${p}" data-i="${i}"><div class="n">${esc(e.n)}<div class="meta"><span class="badge ${e.l}"><i></i>${LN[e.l]}</span>${e.r?'<span class="badge sec">repetição</span>':''}</div></div><span class="min">${e.m} min</span><button class="btn ghost icon sw" data-p="${p}" data-i="${i}" aria-label="Trocar exercício">${ic("swap")}</button><button class="btn ghost icon del" data-p="${p}" data-i="${i}" aria-label="Apagar exercício">${ic("trash")}</button></li>`});
h+=`</ul></div></section>`}
$("out").innerHTML=h;$("acts").style.display="flex"}
$("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;lvl=b.dataset.l;[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));build()};
$("go").onclick=$("again").onclick=build;
function del(p,i){const [e]=plan[p].splice(i,1);undo={p,i,e};render();$("ts").hidden=false;clearTimeout(tt);tt=setTimeout(()=>{$("ts").hidden=true},5000)}
$("tu").onclick=()=>{if(!undo)return;plan[undo.p].splice(undo.i,0,undo.e);undo=null;$("ts").hidden=true;render()};
$("out").onclick=e=>{const dl=e.target.closest(".del");if(dl)return del(dl.dataset.p,+dl.dataset.i);const b=e.target.closest(".sw");if(b)swap(b.dataset.p,+b.dataset.i);else{const a=e.target.closest(".pl");if(a)return openAdd(a.dataset.p);const g=e.target.closest(".tg");if(g){const q=g.dataset.p;col[q]=!col[q];g.setAttribute("aria-expanded",!col[q]);g.querySelector(".chev").classList.toggle("shut",!!col[q]);g.closest(".card").querySelector(".cb").classList.toggle("shut",!!col[q]);return}const x=e.target.closest(".ex");if(x)showDesc(plan[x.dataset.p][+x.dataset.i])}};
$("dur").onclick=e=>{const b=e.target.closest("button");if(!b)return;dur=+b.dataset.d;TG=TGS[dur];[...$("dur").children].forEach(x=>x.classList.toggle("on",x===b));build()};
$("copy").onclick=()=>{let t=`Aula de Pilates · ${LN[lvl]} · ${dur} min\n`;for(const p of["a","m","f"]){t+=`\n${NM[p]}\n`;plan[p].forEach(e=>t+=`- ${e.n} (${e.m} min)\n`)}
const c=$("copy").lastChild;try{navigator.clipboard.writeText(t);c.textContent="Copiado"}catch(x){c.textContent="Não foi possível"}setTimeout(()=>c.textContent="Copiar",1500)};
document.onkeydown=e=>{if(e.key==="Escape")drClose()};
const dr=$("dr"),sh=$("sheet");let y0=null,dy=0;
const drOpen=h=>{sh.innerHTML=h;sh.style.transform="";dr.hidden=false},drClose=()=>{dr.hidden=true};
dr.onclick=e=>{if(e.target===dr||e.target.closest(".cl"))drClose()};
sh.addEventListener("pointerdown",e=>{if(e.target.closest(".grabz")){y0=e.clientY;dy=0;sh.style.transition="none";try{sh.setPointerCapture(e.pointerId)}catch(_){}}});
sh.addEventListener("pointermove",e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
const dEnd=()=>{if(y0===null)return;sh.style.transition="";if(dy>100)drClose();else sh.style.transform="";y0=null};
sh.addEventListener("pointerup",dEnd);sh.addEventListener("pointercancel",dEnd);
function showDesc(e){drOpen(`<div class="grabz"><div class="grab"></div></div><button class="btn ghost icon sx cl" aria-label="Fechar">${ic("x")}</button><div class="dh"><h2>${esc(e.n)}</h2><p class="muted">${NM[e.p]}</p></div><div class="sum"><span class="badge ${e.l}"><i></i>${LN[e.l]}</span><span class="badge">${ic("clock")}${e.m} min</span></div><p class="desc">${esc(DESC[e.n]||e.d||"Sem descrição.")}</p><div class="df dfc"><button class="btn primary cl">Fechar</button></div>`)}
function openAdd(p){drOpen(`<div class="grabz"><div class="grab"></div></div><button class="btn ghost icon sx cl" aria-label="Fechar">${ic("x")}</button><div class="dh"><h2>Novo exercício</h2><p class="muted">${NM[p]}</p></div><div class="fld"><label class="lbl" for="nn">Nome</label><input id="nn" placeholder="Ex.: Single Leg Kick"></div><div class="g2 fld"><div><label class="lbl" for="nl">Nível</label><select id="nl"><option value="F">Fácil</option><option value="I">Intermédio</option><option value="D">Difícil</option></select></div><div><label class="lbl" for="nm">Duração</label><select id="nm"><option value="1">1 min</option><option value="2" selected>2 min</option><option value="3">3 min</option></select></div></div><div class="fld"><label class="lbl" for="nd">Descrição (opcional)</label><textarea id="nd" rows="3" placeholder="Como se executa o exercício"></textarea></div><div class="df"><button class="btn outline cl">Cancelar</button><button class="btn primary" id="ok">Adicionar</button></div>`);
$("ok").onclick=()=>{const n=$("nn").value.trim();if(!n){$("nn").focus();return}const x={n,l:$("nl").value,p,o:3,m:+$("nm").value,d:$("nd").value.trim()};custom.push(x);try{localStorage.setItem("pilx",JSON.stringify(custom))}catch(_){}plan[p].push(x);drClose();render()}}
</script>
</body>
</html>
